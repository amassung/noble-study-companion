# ── Nobi — cloud iOS build → TestFlight ──────────────────────────────────────
# Builds and signs the iOS app on a hosted Mac and uploads it to TestFlight,
# so no local Xcode install is required.
#
# One-time setup (see IOS_RELEASE.md):
#   1. Sign in to codemagic.io with GitHub and add this repository.
#   2. Create an App Store Connect API key (App Store Connect → Users and
#      Access → Integrations → App Store Connect API, role: App Manager).
#   3. In Codemagic → Teams → Integrations → Apple Developer Portal, add that
#      key and name the integration exactly: nobi_app_store_connect
#   4. Start the `ios-testflight` workflow.
#
# Capacitor 8 uses Swift Package Manager, so there is no CocoaPods step and no
# .xcworkspace — the build targets App.xcodeproj directly.

workflows:
  ios-testflight:
    name: Nobi iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # `integrations` belongs at workflow level, not inside `environment` —
    # the schema rejects it there, and publishing's `auth: integration`
    # explicitly requires workflow → integrations → app_store_connect.
    integrations:
      app_store_connect: nobi_app_store_connect

    environment:
      xcode: latest
      # Capacitor 8's CLI requires Node >= 22 and exits fatally on older
      # versions ("The Capacitor CLI requires NodeJS >=22.0.0").
      node: 22
      vars:
        BUNDLE_ID: "app.nobi.study"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # No `ios_signing:` block — signing is done explicitly in the "Set up
      # code signing" step so the profile can be *created* on first run.
      # Leaving both in place makes Codemagic manage signing and silently
      # skip the explicit create.

    scripts:
      - name: Install dependencies
        script: |
          # npm ci enforces package-lock.json, so a lockfile that drifts from
          # package.json fails loudly here instead of silently installing the
          # wrong dependency set (which left @capacitor/cli absent and made
          # `npx cap` die instantly).
          npm ci --legacy-peer-deps

      - name: Build web assets
        script: |
          # The native shell loads the deployed site (capacitor.config.ts →
          # server.url), so these assets are not what users see. We still build
          # them so the project stays valid if we later bundle the shell.
          # Non-fatal: a web build problem must not block the native build.
          npm run build || echo "web build failed — continuing (assets unused at runtime)"

      - name: Capacitor sync (iOS)
        script: |
          set -e
          # `cap sync` exits immediately if webDir is missing. Previously the
          # fallback mkdir only ran when the build *failed*, so a successful
          # build that did not emit this exact path left it absent and sync
          # died in under a second. Guarantee it exists either way.
          mkdir -p .vercel/output/static
          echo "webDir contents:"
          ls -la .vercel/output/static || true
          npx cap sync ios

      - name: Set up code signing
        script: |
          # Explicit signing rather than the managed `ios_signing` block: that
          # only *looks for* an existing profile, and this account had none, so
          # it failed with "No matching profiles found". `--create` makes Apple
          # issue the distribution certificate and provisioning profile on the
          # first run. Credentials come from the app_store_connect integration.
          set -e
          # Fail with a readable message instead of argparse dumping usage:
          # an unset CERTIFICATE_PRIVATE_KEY makes @env: unresolvable, which
          # exits 2 with a wall of help text that hides the real cause.
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is not set."
            echo "Add it in Codemagic → app → Environment variables:"
            echo "  name:  CERTIFICATE_PRIVATE_KEY"
            echo "  value: contents of your PEM private key"
            echo "  mark it Secure."
            exit 1
          fi
          keychain initialize
          # Apple stores only the public certificate; the private key stays on
          # whoever generated it. Without supplying one, a certificate created
          # by an earlier (now-destroyed) build VM comes back unusable:
          # "Cannot save Signing Certificates without certificate private key".
          # CERTIFICATE_PRIVATE_KEY is a Codemagic env var holding a PEM RSA
          # key, so every build reuses the same certificate.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          # CFBundleVersion in Info.plist is $(CURRENT_PROJECT_VERSION), so
          # overriding that build setting stamps the build number. This avoids
          # agvtool, which needs VERSIONING_SYSTEM = apple-generic — a setting
          # the Capacitor template does not include, so agvtool would fail.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight. Internal testers get it with no review;
        # external testers require Apple's (lighter) Beta App Review.
        submit_to_testflight: true
      email:
        recipients:
          - alexander.massung@gmail.com
        notify:
          success: true
          failure: true
